name: OWASP Dependency-Check (hebdomadaire)

# Analyse SCA complémentaire, plus lente : base NVD complète.
# Ajouter le secret NVD_API_KEY (gratuit sur nvd.nist.gov) pour éviter les limitations de débit.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: securepipeline
          path: .
          format: HTML
          args: >
            --failOnCVSS 7
            --enableRetired
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
